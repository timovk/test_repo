[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlfed"
version = "1.0.0"
description = "NL Federal Election Simulator — the Netherlands transplanted into a fictional U.S.-style federal electoral system (Electoral College, single-member House districts, staggered Senate, live election night)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NL Federal Election Simulator contributors" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "scipy>=1.11",
    "geopandas>=1.0",
    "shapely>=2.1",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "pyarrow>=15",
    "networkx>=3.2",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
nlfed = "app.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app" = ["ui/static/**/*", "db/migrations/*.ini", "db/migrations/**/*.py", "db/migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "realdata: requires the processed CBS geography (run `python -m app geography download && python -m app geography build`)",
    "slow: long-running test",
    "integration: end-to-end integration test",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyogrio.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["E501", "RUF012", "N802", "N803", "N806", "B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "N"]
"src/app/db/migrations/**" = ["E", "F", "I", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
plugins = ["pydantic.mypy"]
