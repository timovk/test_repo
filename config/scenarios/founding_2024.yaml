# FICTIONAL scenario — the founding general election of the (fictional) Federal Republic of the
# Netherlands.  Geography is REAL (CBS); every party, person, poll and number below is invented.
#
# Elected in 2024: the President (174 electoral votes, 88 to win), the entire Tweede Kamer
# (150 single-member districts), all 24 Eerste Kamer seats (classes 1–3) and the 12 governors.
scenario:
  slug: founding-2024
  name: Founding General Election 2024
  description: >-
    The first election under the new federal constitution.  Eight fictional parties compete;
    six field presidential tickets.  The liberal VLP and the green-left PA start as favourites,
    the national-populist NVB is strong in the periphery and the Christian-democratic CVU in the
    south and east.
  year: 2024
  election_type: general
  election_date: 2024-11-05
  seed: 20240001
  political_geography_seed: 1848

parties_file: parties/fictional.yaml

party_events:
  - {year: 2023, party: PA, event: founded}
