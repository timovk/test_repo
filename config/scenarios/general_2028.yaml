# Structural realignment since 2024 (FICTIONAL): part of the DM and SAP electorate has moved to
# the PA, the NVB has lost ground to the governing VLP's tougher migration line.  These baseline
# shares override the parties' base_share for this election (the political geography is kept).
calibration:
  national: {PA: 0.255, VLP: 0.215, NVB: 0.16, CVU: 0.13, DM: 0.07, SAP: 0.07, PLB: 0.07, RV: 0.03}

polling:
  generate: true
  start_date: 2028-07-10
  national_polls: 50
  province_polls: 72
  district_polls: 40
  senate_polls: 16
  governor_polls: 24
  generic_ballot_polls: 24
  true_polling_error_sd: 0.02
  pollsters:
    - {name: Veldwerk & Statistiek, rating: 1.5, rating_label: A, method: probability panel, typical_sample: 2400}
    - {name: Delta Meningsonderzoek, rating: 1.3, rating_label: A-, method: mixed mode, typical_sample: 1800}
    - {name: Noorderlicht Panels, rating: 1.1, rating_label: B+, method: online, house_effects: {PLB: 0.8, PA: -0.4}}
    - {name: Rivierland Research, rating: 1.0, rating_label: B, method: IVR, house_effects: {CVU: 0.7, DM: -0.3}}
    - {name: Hofstad Opinie, rating: 0.8, rating_label: B-, method: online, house_effects: {VLP: 0.9, NVB: -0.7}}
    - {name: Polderpanel, rating: 0.7, rating_label: C+, method: online opt-in, typical_sample: 1000, house_effects: {NVB: 1.2, DM: -0.5}}

