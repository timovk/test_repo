# FICTIONAL scenario — the 2028 general election, the playable demo.  Geography is REAL (CBS);
# every party, person, poll and number below is invented.
#
# Elected in 2028: the President, the entire Tweede Kamer, Senate class 2 (8 seats) and the 12
# governors.  The Electoral College is designed to be genuinely multiparty: the green-left PA
# (front-runner) and the incumbent liberal president (VLP) both have paths to 88 electoral votes
# through the Zuid-Holland / Utrecht / Gelderland toss-ups, the national-populist NVB carries the
# periphery (Limburg, Drenthe, Fryslân, Zeeland) and the Christian-democratic CVU is favoured in
# Noord-Brabant and competitive in Overijssel — so a contingent election (no majority) is plausible
# but not the most likely outcome.  Measured with shocks only (1000 draws, REAL geography):
# PA ≈ 47 % outright, VLP ≈ 15 %, contingent ≈ 38 % (see docs/SIMULATION.md §7.1).
scenario:
  slug: demo-2028
  name: General Election 2028
  description: >-
    President Charlotte Verbeek (VLP) seeks re-election against a resurgent green-left PA led by
    Lotte van der Ploeg, NVB veteran Ronald Kroon and a CVU ticket built to win the south.  The
    agrarian Plattelandsbond renamed itself in 2027 and fields no presidential ticket.
  year: 2028
  election_type: general
  election_date: 2028-11-07
  seed: 20280001
  political_geography_seed: 1848

parties_file: parties/fictional.yaml

party_overrides:
  PLB:
    name: Plattelands- en Regiopartij
    abbreviation: PRP

party_events:
  - year: 2027
    party: PLB
    event: renamed
    new_name: Plattelands- en Regiopartij
    new_abbreviation: PRP

