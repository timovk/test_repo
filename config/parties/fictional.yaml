# FICTIONAL parties of the fictional Federal Republic of the Netherlands.
#
# These eight parties are invented.  They are loosely modelled on Dutch political *families*
# (green-left, left-populist, economic-liberal, social-liberal, Christian-democratic,
# national-populist, agrarian, orthodox-Protestant) so that the simulated electoral geography looks
# plausible, but they are not real parties and their numbers are not real results or polls.
#
# Parameters (docs/SIMULATION.md §2): base_share (national baseline share, calibrated exactly),
# turnout_propensity (logit shift of supporters' turnout), demographics (utility per
# population-SD of a REAL CBS indicator), urbanity (CBS class 1 = very urban … 5 = rural),
# provinces / regions (config/regions.yaml) / municipalities (CBS codes) as logit shifts.
parties:
  - code: PA
    name: Progressieve Alliantie
    abbreviation: PA
    color: "#2E9E54"
    family: green-left / social-democratic
    description: Fictional green-left and social-democratic alliance; strongest in big cities, university towns and among young, highly educated voters.
    ideology: {economic: -0.6, social: -0.7, europe: 0.6}
    base_share: 0.2
    turnout_propensity: 0.10
    founded_year: 2023
    demographics:
      pct_education_high: 0.26
      pct_age_25_45: 0.12
      pct_single_households: 0.16
      pct_origin_non_europe: 0.10
      pct_owner_occupied: -0.12
      pct_age_65_plus: -0.04
      income_per_capita_keur: -0.06
    urbanity: {"1": 0.30, "2": 0.12, "3": 0.0, "4": -0.12, "5": -0.28}
    provinces: {GR: 0.12, UT: 0.05, NH: 0.08, LI: -0.12, ZE: -0.10}
    regions: {university_towns: 0.20, randstad_core: 0.08, bible_belt: -0.60, bible_belt_fringe: -0.20, catholic_south: -0.08, fishing_towns: -0.30}

  - code: SAP
    name: Socialistische Arbeiderspartij
    abbreviation: SAP
    color: "#D62828"
    family: left-populist
    description: Fictional left-populist workers' party; lower-income urban neighbourhoods and old industrial areas.
    ideology: {economic: -0.8, social: -0.1, europe: -0.4}
    base_share: 0.07
    turnout_propensity: -0.20
    founded_year: 2023
    demographics:
      pct_education_low: 0.22
      income_per_capita_keur: -0.22
      pct_owner_occupied: -0.20
      pct_age_65_plus: 0.04
    urbanity: {"1": 0.05, "2": 0.08, "3": 0.05, "4": -0.05, "5": -0.15}
    provinces: {GR: 0.20, LI: 0.10, NB: 0.05, DR: 0.05}
    regions: {groningen_gasfield: 0.30, veenkolonien: 0.35, twente: 0.12, limburg_mining: 0.30, bible_belt: -0.50, gooi_wassenaar: -0.40}
    municipalities: {GM0828: 0.40, GM0268: 0.15, GM1982: 0.15, GM0479: 0.10}

