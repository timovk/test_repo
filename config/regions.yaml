# Named political regions — a FICTIONAL political-assumption layer over REAL places.
#
# The municipalities and provinces are real (CBS 2025 names/codes); grouping them into
# "political regions" and giving parties utility shifts per region (PartySpec.regions) are
# modelling assumptions of this simulator, inspired qualitatively by well-known Dutch electoral
# geography.  They are not official statistics.
#
# Each region is the union of `provinces` (codes), `municipalities` (REAL names; add a province
# code to disambiguate, e.g. {name: Bergen, province: NH}) and `codes` (CBS GMxxxx codes), minus
# `exclude`.  Names are matched case/diacritics-insensitively against the current CBS
# municipalities (see app.simulation.regions); unresolved names are reported, never fatal.
version: 1
description: Political regions of the fictional Federal Republic of the Netherlands (demo layer).

