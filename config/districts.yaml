# House district generator configuration (FICTIONAL districts drawn over REAL CBS geography).
# Validated by app.districts.config.DistrictConfig; every parameter is documented in
# docs/DISTRICTING.md.  The canonical JSON of this document (minus `workers`) plus the manual
# overrides is hashed and stored with every plan: same data + seed + config ⇒ identical plan.

method: multires_bisection

# ---- population equality -------------------------------------------------------------------
# Every district should be within ±target of its provincial target (province population / seats);
# a plan with a district beyond ±max fails validation.
target_deviation_pct: 2.0
max_deviation_pct: 5.0
# Bisection tolerance funnel: a side that will still be split into k districts must have an
# average deviation within target / k**exponent (0 = same tolerance everywhere, 1 = constant
# absolute window).  0.5 leaves room for the lower levels while allowing whole-municipality cuts.
tolerance_exponent: 0.5

# ---- cut search (per bisection) ------------------------------------------------------------------
sweep_angles: 18            # straight sweep lines at 10° steps (seeded rotation)
geodesic_orderings: 8       # graph-distance orderings grown from extreme atoms
centre_orderings: 3         # graph-distance orderings grown from the most populous atoms (cities)
spectral_ordering: true     # Fiedler-vector ordering of the atom graph
candidates_per_ordering: 3  # best prefixes per ordering checked exactly for contiguity
max_refine_rounds: 6        # municipality → wijk → buurt refinement rounds per cut
use_wijk_level: true        # refine municipalities into CBS wijken before buurten
split_slack: 0              # also try district splits k/2 ± slack
exact_search_max_k: 4       # exhaustive whole-municipality search for regions of ≤ 4 districts …
exact_search_max_atoms: 48  # … with ≤ 48 atoms …
exact_search_max_subsets: 6000  # … enumerating at most this many connected subsets
water_link_border_m: 250.0  # nominal border length of a water link (bridge/ferry/island link)

# ---- multi-start ---------------------------------------------------------------------------------
restarts: 12                # independent attempts per province; the best objective wins
restart_jitter: 0.25        # relative jitter of cut weights / funnel exponent in restarts ≥ 1

# Cut scoring (lower is better): deviation / tolerance, municipal splits, compactness.
cut:
  deviation: 1.0
  new_split: 3.0            # per municipality split for the first time
  small_split: 2.0          # extra × (1 − municipality population / target): avoid splitting villages
  existing_split: 0.3       # per already-split municipality (large city) cut again
  cut_length: 0.8           # × cut length / sqrt(region area)
  unbalanced: 0.15

# Local search after the bisection: objective weights (deviations in %).
local_search:
  enabled: true
  max_passes: 40
  fragment_moves: true      # whole municipalities / municipal fragments
  wijk_moves: true          # CBS wijk fragments
  unit_moves: true          # single boundary buurten
  max_fragment_units: 400
  chain_moves: true         # un-split a municipality, then rebalance greedily (ejection chain)
  chain_length: 8
  chain_max_share: 0.25
  weight_hard: 1000.0       # per %-point beyond max_deviation_pct
  weight_target: 100.0      # per %-point beyond target_deviation_pct
  weight_target_district: 50.0  # per district beyond target_deviation_pct
  weight_split: 10.0        # per split municipality
  weight_fragment: 2.0      # per extra municipal fragment
  weight_deviation: 1.0     # per (deviation %)²
  weight_cut_km: 0.2        # per km of district boundary

# Recombination ("merge-split") of the best restarts: re-draw every pair of adjacent districts and
# the districts sharing an over-split municipality (≤ max_region_districts districts) with the
# bisection above; keep a re-drawn region when the local-search objective improves.
merge_split:
  enabled: true
  max_passes: 2             # passes over all pairs / over-split municipalities (stop when one is idle)
  max_region_districts: 4   # largest region re-drawn around an over-split municipality
  restarts: 3               # best restarts that are recombined; the best result wins

# Worker processes (0 = auto, 1 = serial).  Results are identical for every value; not hashed.
workers: 1

# Manual overrides (relative to config/); applied by the plan-generation service.
overrides_file: districts/overrides.yaml

# Descriptive names.  Regions are naming aids only (well-known Dutch region names over REAL CBS
# municipality codes of the 2025 vintage); unknown codes are ignored.
