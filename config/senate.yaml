# Senate (Eerste Kamer) classes of the (FICTIONAL) Federal Republic of the Netherlands.
#
# Every province has two senators serving staggered six-year terms; one of the three classes
# (8 seats each) is elected every two years, and a province's two seats are always in different
# classes (so no province elects both senators at once).
#
# The twelve provinces are partitioned into three groups of four.  Every group's seat pair uses a
# different pair of classes — {1,2}, {2,3}, {1,3} — so each class contains exactly two groups
# = 8 seats.  The groups were drawn "snake-style" from the population ranking
# (ZH NH NB GE UT OV LI FR GR DR FL ZE → A B C C B A A B C C B A) so every group mixes large and
# small provinces and every class election covers a similar share of the country (≈ 11.5–12.5 M
# inhabitants of ≈ 18 M) with provinces in the north, east, south and west.
#
# Seat 1 of a province is its seat in the lower-numbered class (list order = seat order).
# If this file does not list exactly the configured provinces, a deterministic round-robin
# assignment is generated instead (`fallback: round_robin`) — see app/districts/senate.py.
groups:
  A:
    classes: [1, 2]
    provinces: [ZH, OV, LI, ZE]
    description: "largest province + three smaller ones (west, east, south, south-west)"
  B:
    classes: [2, 3]
    provinces: [NH, UT, FR, FL]
    description: "second-largest province + centre and north"
  C:
    classes: [1, 3]
    provinces: [NB, GE, GR, DR]
    description: "third- and fourth-largest provinces + the north-east"
# round_robin | error
fallback: round_robin
